<text x="820" y="85.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">Glutamine</text>
<rect x="1071.8" y="67.0" width="56.4" height="26" rx="12" fill="#fff" stroke="#52514e" stroke-width="1.4"/>
<text x="1100" y="85.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">NH₄⁺</text>
<rect x="995.8" y="179.5" width="208.39999999999998" height="41" rx="12" fill="#fff" stroke="#52514e" stroke-width="1.4"/>
<text x="1100" y="197.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">Asp, Phe, Tyr, Val, Leu,</text>
<text x="1100" y="212.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">Ile, His, Lys, Arg, Gly</text>
