<text x="110" y="205.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">CO₂ (photosynthesis)</text>
<rect x="241.0" y="187.0" width="178.0" height="26" rx="12" fill="#fff" stroke="#52514e" stroke-width="1.4"/>
<text x="330" y="205.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">Citrate / Isocitrate</text>
<rect x="493.8" y="187.0" width="132.39999999999998" height="26" rx="12" fill="#1f1f1d" stroke="#52514e" stroke-width="1.4"/>
<text x="560" y="205.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2-Oxoglutarate</text>
