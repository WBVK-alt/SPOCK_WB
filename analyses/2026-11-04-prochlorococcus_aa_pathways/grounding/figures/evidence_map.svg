<text x="560" y="425.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">NtcA (N regulator)</text>
<rect x="764.4" y="407.0" width="231.2" height="26" rx="12" fill="#fff" stroke="#52514e" stroke-width="1.4"/>
<text x="880" y="425.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">N-uptake genes (glnA, amt1)</text>
<rect x="142.4" y="407.0" width="155.2" height="26" rx="12" fill="#fff" stroke="#52514e" stroke-width="1.4"/>
<text x="220" y="425.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f1f1d">Nitrogen shortage</text>
<path d="M195,200 L245,200" fill="none" stroke="#b5b3ad" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 5" marker-end="url(#mn)"/>
<text x="220.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">carbon actually flows this way?</text>
<text x="220.0" y="185.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">no flux data in KG</text>
<path d="M415,200 L475,200" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="445.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">icd: Isocitrate → 2-OG + CO₂</text>
<text x="445.0" y="185.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">(R00267; 45/45 genomes)</text>
<path d="M645,200 L735,200" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="690.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">GOGAT (glsF): Gln + 2-OG → 2 Glu</text>
<text x="690.0" y="185.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">(R00021; 45/45)</text>
<path d="M1015,80 L905,80" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="960.0" y="70.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4"></text>
<path d="M820,178 Q760,140 820,102" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="700" y="128" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">glnA: Glu + NH₄⁺ → Gln</text>
<text x="700" y="141" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">(R00253; 45/45)</text>
<path d="M820,102 Q880,140 820,178" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="820.0" y="130.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4"></text>
<path d="M905,200 L1015,200" fill="none" stroke="#9e9ac8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5" marker-end="url(#mp)"/>
<text x="960.0" y="170.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">transaminases (aspC, ilvE, hisC, dapL…)</text>
<text x="960.0" y="183.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">most amino acids — not Ala, Ser</text>
<path d="M900,207 L1020,293" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="960.0" y="264.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">proB, argJ, argD</text>
<path d="M305,420 L475,420" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="390.0" y="394.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">ntcA induced ≤22× (MED4)</text>
<text x="390.0" y="407.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">≤12× (MIT9313)</text>
<path d="M645,420 L795,420" fill="none" stroke="#470f84" stroke-width="3.2" stroke-linecap="round" marker-end="url(#my)"/>
<text x="720.0" y="406.0" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">glnA up in 6/7 N experiments</text>
<path d="M560,222 Q470,330 560,398" fill="none" stroke="#b5b3ad" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 5" marker-end="url(#mn)"/>
<text x="430" y="300" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">2-OG builds up and</text>
<text x="430" y="313" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">switches on NtcA?</text>
<text x="430" y="326" text-anchor="middle" font-size="10.5" fill="#52514e" paint-order="stroke" stroke="#fcfcfb" stroke-width="4">not in KG</text>
<text x="690" y="252" text-anchor="middle" font-size="11" fill="#52514e">acnB up in 4/7 N experiments (never down)</text>
<text x="690" y="267" text-anchor="middle" font-size="11" fill="#52514e">icd up 3/7, down 2/7 · Tolonen 2006: both up in MED4</text>
<line x1="24" x2="74" y1="520" y2="520" stroke="#470f84" stroke-width="3.2" stroke-linecap="round"/><text x="84" y="524" font-size="12" fill="#52514e">supported by KG data (gene + reaction, or expression)</text>
<line x1="24" x2="74" y1="542" y2="542" stroke="#9e9ac8" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/><text x="84" y="546" font-size="12" fill="#52514e">partly supported</text>
<line x1="24" x2="74" y1="564" y2="564" stroke="#b5b3ad" stroke-width="2.6" stroke-dasharray="2 5" stroke-linecap="round"/><text x="84" y="568" font-size="12" fill="#52514e">not in the KG — literature / interpretation</text>
<text x="24" y="610" font-size="11" fill="#8a8984">Reactions = KEGG reaction records for MED4 genes in the KG; genome counts = KEGG KO presence across 45 Prochlorococcus genomes.</text>
</svg>