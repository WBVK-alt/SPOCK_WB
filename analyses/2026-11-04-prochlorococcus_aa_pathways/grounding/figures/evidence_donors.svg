<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui,Segoe UI,sans-serif">
<rect width="1200" height="760" fill="#fcfcfb"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#1f1f1d">C · Where each amino acid gets its nitrogen (MED4, KEGG reactions in the KG)</text>
<text x="24" y="52" font-size="12" fill="#52514e">Filled = gene + reaction verified in the KG by this script; outlined = route inferred or not represented in the KG.</text>
