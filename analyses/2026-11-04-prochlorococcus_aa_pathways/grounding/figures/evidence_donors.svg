<rect x="900" y="248" width="250" height="38" rx="8" fill="#fff" stroke="#c9c6e3" stroke-width="1.6"/>
<text x="912" y="265" font-size="13" font-weight="700" fill="#1f1f1d">Thr</text>
<text x="952" y="265" font-size="11" fill="#1f1f1d">—</text>
<text x="912" y="279" font-size="10" fill="#1f1f1d">via Asp (N already from Glu)</text>
<rect x="900" y="294" width="250" height="38" rx="8" fill="#fff" stroke="#c9c6e3" stroke-width="1.6"/>
<text x="912" y="311" font-size="13" font-weight="700" fill="#1f1f1d">Met</text>
<text x="952" y="311" font-size="11" fill="#1f1f1d">—</text>
<text x="912" y="325" font-size="10" fill="#1f1f1d">via Asp (N already from Glu)</text>
<rect x="900" y="340" width="250" height="38" rx="8" fill="#fff" stroke="#c9c6e3" stroke-width="1.6"/>
<text x="912" y="357" font-size="13" font-weight="700" fill="#1f1f1d">Cys</text>
<text x="952" y="357" font-size="11" fill="#1f1f1d">—</text>
<text x="912" y="371" font-size="10" fill="#1f1f1d">via Ser</text>
<text x="24" y="730" font-size="12.5" fill="#1f1f1d">14 of 20 amino acids: nitrogen arrives via GS-GOGAT, glutamate or glutamine, verified as KEGG reactions of MED4 genes. Thr, Met, Cys, Asn get it second-hand; Ala and Ser are the exceptions.</text>
